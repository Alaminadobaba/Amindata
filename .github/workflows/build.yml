
name: Build AminData APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract AminData project
        run: |
          unzip -o AminDataWebView-Download.zip -d extracted

      - name: Verify project files
        run: |
          test -f extracted/AminDataWebView/app/build.gradle
          test -f extracted/AminDataWebView/settings.gradle

      - name: Fix Java and Kotlin JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("extracted/AminDataWebView/app/build.gradle")
          s = p.read_text()

          fix = """
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          """

          if "sourceCompatibility JavaVersion.VERSION_17" not in s:
              s = s.replace("android {", "android {" + fix, 1)

          p.write_text(s)

          print("Updated Gradle configuration:")
          print(s)
          PY

      - name: Build AminData APK
        run: |
          cd extracted/AminDataWebView
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          APK="extracted/AminDataWebView/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK build successful"
          ls -lh "$APK"

      - name: Upload AminData APK
        uses: actions/upload-artifact@v4
        with:
          name: AminData-APK
          path: extracted/AminDataWebView/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
