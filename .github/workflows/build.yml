
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.amindata.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.amindata.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.biometric:biometric:1.1.0'
}

name: Build AminData APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract AminData project
        run: |
          mkdir -p extracted
          unzip -o AminDataWebView-Download.zip -d extracted

      - name: Check project files
        run: |
          ls -la extracted/AminDataWebView
          test -f extracted/AminDataWebView/app/build.gradle

      - name: Build AminData APK
        working-directory: extracted/AminDataWebView
        run: |
          gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          test -s extracted/AminDataWebView/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AminData APK
        uses: actions/upload-artifact@v4
        with:
          name: AminData-APK
          path: extracted/AminDataWebView/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
