
name: Build AminData APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract AminData project
        run: |
          unzip -o AminDataWebView-Download.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/AminDataWebView
          gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          test -s extracted/AminDataWebView/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AminData-APK
          path: extracted/AminDataWebView/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Fix Java and Kotlin JVM targets
        run: |
          sed -i "/defaultConfig {/i\\    compileOptions {\\n        sourceCompatibility JavaVersion.VERSION_17\\n        targetCompatibility JavaVersion.VERSION_17\\n    }\\n\\n    kotlinOptions {\\n        jvmTarget = '17'\\n    }\\n" extracted/AminDataWebView/app/build.gradle
